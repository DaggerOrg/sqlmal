name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: studio
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U studio"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatting
        run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (server unit and PostgreSQL integration, web unit)
        run: npm test
      - run: npm run build
      - name: The CLI starts
        run: node apps/server/dist/main.js version
      - run: npm audit --omit=dev
