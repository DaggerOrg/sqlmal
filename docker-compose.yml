# A throwaway Postgres for trying Migrate Studio and for running its tests.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 2s
      timeout: 3s
      retries: 20
